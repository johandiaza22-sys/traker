plugins {
    id 'java'
    id 'net.neoforged.moddev' version '1.0.19'
}

version = '1.0.0'
group = 'com.example.shizutracker'

base {
    archivesName = 'shizutracker'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    runs {
        client {
            client()
        }
    }
    mods {
        shizutracker {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}
